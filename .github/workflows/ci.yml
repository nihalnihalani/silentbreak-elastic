name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SILENTBREAK_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-serve.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-serve.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Run mock demo end-to-end
        run: python scripts/run_demo.py
